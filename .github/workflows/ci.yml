name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (incl. Hermes runtime for integration tests)
        run: python -m pip install --quiet fastapi pydantic hermes-agent

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check plugin.js (ESM)
        run: |
          cp plugin.js plugin_check.mjs
          node --check plugin_check.mjs
          rm -f plugin_check.mjs

      - name: Run JS state tests
        run: node --test tests/test_dock_state.mjs tests/test_botface.mjs tests/test_routines.mjs

      - name: Run Python test suite
        run: python -m unittest discover -s tests -v
