name: Bug report
description: Report a reproducible Hermes Agent Dock defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, private conversations, profile names, session titles, local paths, and unrelated notifications before submitting.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private data from this report and its attachments.
          required: true
        - label: This is not a security vulnerability. Security reports follow SECURITY.md.
          required: true
  - type: input
    id: version
    attributes:
      label: Agent Dock version
      placeholder: v0.2.1
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes Desktop version
      placeholder: e.g. 0.20.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Surface
      options:
        - Floating
        - Docked
        - Status bar launcher
        - Command palette launcher
        - Installer or uninstaller
        - Backend/API
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Privacy-safe evidence
      description: Add sanitized logs, screenshots, or test output. Do not paste secrets or private content.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
